kind = "web"
previewPath = "/"
title = "WeatherWise"
version = "1.0.0"
id = "artifacts/weatherwise"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20142

[services.development]
run = "pnpm --filter @workspace/weatherwise run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weatherwise", "run", "build" ]
publicDir = "artifacts/weatherwise/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20142"
BASE_PATH = "/"
